<div class="rbt-elements-area bg-color-white rbt-section-gap">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5">
        <div class="rbt-contact-form contact-form-style-1 login-flow-card">
          <div class="login-flow-card__header text-center">
            <span class="login-flow-card__step">{{ stepLabel }}</span>
            <h3 class="title">{{ stepTitle }}</h3>
            <p class="login-flow-card__description">
              {{ stepDescription }}
            </p>
          </div>

          <form *ngIf="currentStep === 'identify'" [formGroup]="loginForm" (ngSubmit)="sendOtp()">
            <div class="form-group">
              <input
                id="login-mobile"
                type="text"
                formControlName="user"
                maxlength="10"
                minlength="10"
                inputmode="numeric"
                autocomplete="tel"
                [class.has-value]="!!loginForm.get('user')?.value"
                [attr.aria-describedby]="submitted && loginForm.get('user')?.errors ? 'login-mobile-error' : null"
                [attr.aria-invalid]="submitted && loginForm.get('user')?.invalid ? 'true' : null"
                (keypress)="onlyNumbers($event)"
              />
              <label for="login-mobile">Mobile *</label>
              <span class="focus-border"></span>

              <div
                id="login-mobile-error"
                class="text-danger small mt-1"
                *ngIf="submitted && loginForm.get('user')?.errors"
              >
                Mobile is required
              </div>
            </div>

            <div class="form-submit-group">
              <button type="submit" class="rbt-btn btn-md w-100" [disabled]="isLoading">
                {{ isLoading ? 'Sending...' : 'Proceed' }}
              </button>
            </div>
          </form>

          <form *ngIf="currentStep === 'otp'" (submit)="onOtpSubmit($event)">
            <fieldset class="otp-fieldset mb-3">
              <legend class="sr-only">Enter the 6-digit OTP</legend>

              <div class="otp-container text-center">
                <input
                  *ngFor="let digit of otpArray; let i = index"
                  [id]="'otp-digit-' + i"
                  [value]="otpValues[i]"
                  maxlength="1"
                  type="text"
                  class="otp-input"
                  inputmode="numeric"
                  autocomplete="one-time-code"
                  [attr.aria-label]="'OTP digit ' + (i + 1) + ' of ' + otpArray.length"
                  (input)="onOtpInput($event, i)"
                  (keydown)="onKeyDown($event, i)"
                  #otpBox
                />
              </div>
            </fieldset>

            <div class="text-center mb-3">
              <small *ngIf="timer > 0">Resend OTP in {{ timer }} sec</small>

              <button *ngIf="timer === 0" type="button" class="btn btn-link" (click)="resendOtp()">
                Resend OTP
              </button>
            </div>

            <div class="form-submit-group">
              <button type="submit" class="rbt-btn btn-gradient w-100" [disabled]="isLoading">
                {{ isLoading ? 'Verifying...' : 'Verify & Continue' }}
              </button>
            </div>

            <div class="text-center mt-3">
              <button type="button" class="btn btn-link login-link-button" (click)="backToUserInput()">
                Change mobile number
              </button>
            </div>
          </form>

          <form *ngIf="currentStep === 'profile'" [formGroup]="profileForm" (ngSubmit)="completeProfile()">
            <div class="form-group">
              <input
                id="profile-name"
                type="text"
                formControlName="name"
                autocomplete="name"
                [class.has-value]="!!profileForm.get('name')?.value"
                [attr.aria-describedby]="
                  profileForm.get('name')?.touched && profileForm.get('name')?.errors
                    ? 'profile-name-error'
                    : null
                "
                [attr.aria-invalid]="
                  profileForm.get('name')?.touched && profileForm.get('name')?.invalid ? 'true' : null
                "
              />
              <label for="profile-name">Name *</label>
              <span class="focus-border"></span>

              <div
                id="profile-name-error"
                class="text-danger small mt-1"
                *ngIf="profileForm.get('name')?.touched && profileForm.get('name')?.errors">
                <div *ngIf="profileForm.get('name')?.errors?.['required']">Name is required</div>
                <div *ngIf="profileForm.get('name')?.errors?.['minlength']">
                  Minimum 3 characters required
                </div>
              </div>
            </div>

            <div class="form-group">
              <input
                id="profile-email"
                type="email"
                formControlName="email"
                autocomplete="email"
                [class.has-value]="!!profileForm.get('email')?.value"
                [attr.aria-describedby]="
                  profileForm.get('email')?.touched && profileForm.get('email')?.errors
                    ? 'profile-email-error'
                    : null
                "
                [attr.aria-invalid]="
                  profileForm.get('email')?.touched && profileForm.get('email')?.invalid ? 'true' : null
                "
              />
              <label for="profile-email">Email *</label>
              <span class="focus-border"></span>

              <div
                id="profile-email-error"
                class="text-danger small mt-1"
                *ngIf="profileForm.get('email')?.touched && profileForm.get('email')?.errors">
                <div *ngIf="profileForm.get('email')?.errors?.['required']">Email is required</div>
                <div *ngIf="profileForm.get('email')?.errors?.['email']">Invalid email format</div>
              </div>
            </div>

            <div class="form-submit-group">
              <button type="submit" class="rbt-btn btn-gradient w-100" [disabled]="profileForm.invalid || isLoading">
                {{ isLoading ? 'Saving...' : 'Complete Profile' }}
              </button>
            </div>

            <div class="text-center mt-3">
              <button type="button" class="btn btn-link login-link-button" (click)="backToUserInput()">
                Use a different mobile number
              </button>
            </div>
          </form>

          <div class="text-danger mt-3 text-center" *ngIf="errorMessage">
            {{ errorMessage }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="rbt-separator-mid">
        <div class="container">
            <hr class="rbt-separator m-0">
        </div>
    </div>
